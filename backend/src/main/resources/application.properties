# ===================================================
#   SAHAYAK AI - Spring Boot Configuration
# ===================================================

spring.application.name=sahayak-ai-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sahayak_ai}
spring.data.mongodb.database=sahayak_ai
spring.data.mongodb.auto-index-creation=true

# JWT Security Settings
# Base64 encoded secret key (HMAC-SHA256 256-bit compliant)
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS01MTItYml0LXNoYTI1Ni1zZWNyZXQta2V5LWZvci1zYWhheWFrLWFpLXByb2plY3Q=}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Settings
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.sahayakai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
